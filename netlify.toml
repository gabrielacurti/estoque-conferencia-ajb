[build]
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[[redirects]]
  from = "/api/tiny-auth"
  to = "/.netlify/functions/tiny-auth"
  status = 200

[[redirects]]
  from = "/api/tiny-callback"
  to = "/.netlify/functions/tiny-callback"
  status = 200

[[redirects]]
  from = "/api/tiny-pedidos"
  to = "/.netlify/functions/tiny-pedidos"
  status = 200

[[redirects]]
  from = "/api/tiny-estoque"
  to = "/.netlify/functions/tiny-estoque"
  status = 200
